name: Rucksack selective build

on:
  push:
    branches:
      - feature/rucksack-split-xdelta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build the PlayStation toolchain image
        run: docker build -t hmbtn-build .

      - name: Build the game binaries
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD":/src -w /src hmbtn-build \
            bash -c 'cmake -S . -B build -G Ninja && cmake --build build --target program'

      - name: Check the farm overlay size
        run: |
          test -s build/11_GF_FARM.bin
          test -s build/SLUS_011.15
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/11_GF_FARM.bin")
          size = p.stat().st_size
          print(f"11_GF_FARM.bin: {size} bytes (0x{size:X})")
          if size > 0x76000:
              raise SystemExit("Farm overlay exceeds the original 0x76000-byte image")
          PY

      - name: Upload selective build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rucksack-selective-build
          path: |
            build/11_GF_FARM.bin
            build/SLUS_011.15
            build/program.elf
            build/program.map
          if-no-files-found: error
          retention-days: 7
