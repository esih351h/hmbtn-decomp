
# Build the 14 code binaries, check them against the original's SHA-1,
# publish the progress report, and upload the memory map for cheat research.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t hmbtn-build .

      - name: Build and check
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/src -w /src hmbtn-build
          bash -c 'cmake -S . -B build -G Ninja && cmake --build build --target check'

      - name: Search inn telephone ordering source
        run: |
          {
            echo "=== TELEPHONE / PHONE ==="
            grep -RniE -C 6 'telephone|phone|call' src include || true

            echo "=== SATURDAY / WEEKDAY ==="
            grep -RniE -C 6 'saturday|weekday|day_of_week|dayofweek' src include || true

            echo "=== SHOPPING / ORDER ==="
            grep -RniE -C 6 'shopping|order|knife|catalog' src include || true
          } > phone-order-search.txt

      - name: Upload telephone ordering source
        uses: actions/upload-artifact@v4
        with:
          name: phone-order-search
          path: phone-order-search.txt

      - name: Extract TV memory symbols
        run: |
          {
            echo "=== MEMORY MAP ==="
            grep -inE 'message_index|message_pairs|message_machine' build/program.map || true

            echo "=== ELF SYMBOLS ==="
            nm -a -n build/program.elf | grep -iE 'message_index|message_pairs|message_machine' || true
          } > tv-symbols.txt

      - name: Upload TV symbols
        uses: actions/upload-artifact@v4
        with:
          name: tv-symbols
          path: tv-symbols.txt

      - name: Upload memory map
        uses: actions/upload-artifact@v4
        with:
          name: hmbtn-memory-map
          path: |
            build/program.map
            build/program.elf

      - name: Progress report
        run: |
          curl -fsSL -o objdiff-cli \
              https://github.com/encounter/objdiff/releases/download/v3.8.2/objdiff-cli-linux-x86_64
          echo "e5445089a6f707e30cb5e02992451b604619cedfd2660ee2373a86bfefd9e718  objdiff-cli" | sha256sum -c -
          chmod +x objdiff-cli
          python3 tools/objdiff_config.py build > objdiff.json
          ./objdiff-cli report generate -o build/report.json

      - name: Upload the report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SLUS_011.15_report
          path: build/report.json
