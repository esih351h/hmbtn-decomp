
# Build the 14 code binaries, check them against the original's SHA-1,
# publish the progress report, and upload the memory map for cheat research.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t hmbtn-build .

      - name: Build and check
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/src -w /src hmbtn-build
          bash -c 'cmake -S . -B build -G Ninja && cmake --build build --target check'

      - name: Find telephone interaction files
        run: |
          {
            echo "=== FILES CONTAINING TELEPHONE REFERENCES ==="
            grep -RilE 'telephone|phone' src include 2>/dev/null || true
          } > phone-files.txt

      - name: Extract relevant telephone code
        run: |
          {
            while IFS= read -r file; do
              [ -f "$file" ] || continue
              echo
              echo "========== $file =========="
              grep -nEi -C 12 'telephone|phone|saturday|shopping|order|catalog' "$file" || true
            done < phone-files.txt
          } | head -n 350 > phone-order-small.txt

      - name: Upload small telephone report
        uses: actions/upload-artifact@v4
        with:
          name: phone-order-small
          path: phone-order-small.txt

      - name: Progress report
        run: |
          curl -fsSL -o objdiff-cli \
              https://github.com/encounter/objdiff/releases/download/v3.8.2/objdiff-cli-linux-x86_64
          echo "e5445089a6f707e30cb5e02992451b604619cedfd2660ee2373a86bfefd9e718  objdiff-cli" | sha256sum -c -
          chmod +x objdiff-cli
          python3 tools/objdiff_config.py build > objdiff.json
          ./objdiff-cli report generate -o build/report.json

      - name: Upload the report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SLUS_011.15_report
          path: build/report.json
